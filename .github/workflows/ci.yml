name: Tests

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Run safe no-source smoke check
        env:
          AVAILABILITY_MODE: disabled
          DRY_RUN: "true"
        run: python -m src.monitor --once
      - name: Validate Cloudflare Worker syntax
        run: node --check --input-type=module < cloudflare/worker.js
